services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: construction_ai
      POSTGRES_USER: construction
      POSTGRES_PASSWORD: construction
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction -d construction_ai"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - construction_ai_postgres:/var/lib/postgresql/data

volumes:
  construction_ai_postgres:

