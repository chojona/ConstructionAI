version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # ESLint 10 crashes eslint-config-next: eslint-plugin-react, import, and jsx-a11y still peer ESLint 9.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # typescript-6 is the TypeScript 6 API for typescript-eslint. The compiler itself is `typescript` 7.
      - dependency-name: typescript-6
        update-types:
          - version-update:semver-major
    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/client"
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
