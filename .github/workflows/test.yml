name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: construction
          POSTGRES_PASSWORD: construction
          POSTGRES_DB: construction_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction -d construction_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://construction:construction@localhost:5432/construction_ai?schema=public
      DIRECT_DATABASE_URL: postgresql://construction:construction@localhost:5432/construction_ai?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - run: npm test
